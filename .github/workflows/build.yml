name: Build Voltstring
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Configure (universal - Apple Silicon + Intel)"
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCOPY_PLUGINS=OFF
      - name: Build AU + VST3
        run: cmake --build build --config Release --target Voltstring_AU Voltstring_VST3 -- -quiet
      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - build/Voltstring_artefacts/Release/AU/Voltstring.component
          codesign --force --deep -s - build/Voltstring_artefacts/Release/VST3/Voltstring.vst3
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Voltstring_artefacts/Release/AU/Voltstring.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Vlts Jluc
      - name: Make installer
        run: |
          mkdir -p root/Library/Audio/Plug-Ins/Components root/Library/Audio/Plug-Ins/VST3
          cp -R build/Voltstring_artefacts/Release/AU/Voltstring.component root/Library/Audio/Plug-Ins/Components/
          cp -R build/Voltstring_artefacts/Release/VST3/Voltstring.vst3 root/Library/Audio/Plug-Ins/VST3/
          pkgbuild --analyze --root root components.plist
          python3 - <<'PY'
          import plistlib
          comps = plistlib.load(open("components.plist", "rb"))
          print("bundles:", [c.get("RootRelativeBundlePath") for c in comps])
          for c in comps:
              c["BundleIsRelocatable"] = False
              c["BundleIsVersionChecked"] = False
              c["BundleOverwriteAction"] = "upgrade"
          plistlib.dump(comps, open("components.plist", "wb"))
          PY
          pkgbuild --root root --component-plist components.plist --identifier com.jonnylucas.voltstring.pkg --version 1.0.${{ github.run_number }} --install-location / Voltstring-Installer.pkg
      - uses: actions/upload-artifact@v5
        with:
          name: Voltstring-Mac-Installer
          path: Voltstring-Installer.pkg
      - name: Publish download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create latest Voltstring-Installer.pkg -R ${{ github.repository }} --title "Voltstring for Mac" --notes "Download Voltstring-Installer.pkg below, double-click it, then rescan plug-ins in Ableton."
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCOPY_PLUGINS=OFF
      - run: cmake --build build --config Release --target Voltstring_VST3
      - uses: actions/upload-artifact@v5
        with:
          name: Voltstring-Windows-VST3
          path: build/Voltstring_artefacts/Release/VST3
